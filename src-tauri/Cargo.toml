[package]
name = "filetopo"
version = "0.1.0-alpha.1"
description = "Local-first topographic map for folders and documents"
authors = ["Sébastien Dubé"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "filetopo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-clipboard-manager = "=2.3.3"

[dev-dependencies]
tempfile = "3"

# Publication hygiene: strip build-machine paths from the shipped binary.
#
# Cargo's `trim-paths` profile option would be the natural place for this, but
# it is NOT stabilized in Cargo 1.98 (verified: "feature `trim-paths` is
# required ... not stabilized in this version of Cargo"). Enabling it here makes
# the manifest unparsable on stable, so it is deliberately absent.
#
# The stable equivalent is rustc's `--remap-path-prefix`, which cannot be
# hardcoded here because its arguments are machine-specific absolute paths that
# must never be committed. It is applied at build time instead, by
# `scripts/build-release-clean.ps1`, which computes the prefixes locally.
#
# Neither mechanism rewrites `env!("CARGO_MANIFEST_DIR")`, which the compiler
# expands into a string literal; that macro is therefore kept out of shipped
# code entirely (see `scan_synthetic_fixture` in `src/lib.rs`).
